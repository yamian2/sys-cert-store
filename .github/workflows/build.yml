name: Linux build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizers: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake perl python3 git libsqlite3-dev ca-certificates binutils
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSYS_CERT_STORE_SANITIZERS=${{ matrix.sanitizers }}
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure

  rpm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: registry.access.redhat.com/ubi9/ubi:latest
            install: dnf install -y gcc-c++ cmake make perl-core python3 git sqlite-devel ca-certificates binutils libatomic
          - image: mcr.microsoft.com/azurelinux/base/core:3.0
            install: tdnf install -y build-essential cmake perl python3 git sqlite-devel ca-certificates findutils binutils libatomic
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Import the Azure Linux repository key shipped in the image
        if: matrix.image == 'mcr.microsoft.com/azurelinux/base/core:3.0'
        run: rpm --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY && gpg --batch --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
      - run: ${{ matrix.install }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure
